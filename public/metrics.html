<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vouch — Network metrics</title>
<meta name="description" content="Live Vouch network metrics: capabilities, staked providers, slashable capital, verified-settlement rate, and the outcome-insurance pool.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22vg%22%20x1%3D%224%22%20y1%3D%222%22%20x2%3D%2228%22%20y2%3D%2230%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20stop-color%3D%22%23e6c988%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c9a24e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M16%202.4l11.2%203.7v8.1c0%207.6-5.5%2012.8-11.2%2015C10.3%2027%204.8%2021.8%204.8%2014.2V6.1z%22%20fill%3D%22url%28%23vg%29%22/%3E%3Cpath%20d%3D%22M10.6%2016.4l3.9%203.9L21.7%2012%22%20stroke%3D%22%231a1509%22%20stroke-width%3D%222.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101012;--bg2:#17181b;--bg3:#202127;--panel:#141519;
  --border:rgba(236,238,230,.07);--border2:rgba(236,238,230,.14);
  --t1:#f3f0e9;--t2:#a8a49a;--t3:#6c6a62;
  --acc:#d2ee1c;--acc2:#a4c200;--acc-fg:#11140a;
  --acc-soft:rgba(210,238,28,.09);--red:#ff5c64;--green:#4bd888;
  --grad:linear-gradient(100deg,var(--acc) 10%,var(--acc2) 90%);
}
body{font-family:'Geist',sans-serif;background:var(--bg);color:var(--t1);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.mono{font-family:'Geist Mono',monospace}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.sky{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(58rem 34rem at 78% -8%,rgba(210,238,28,.11),transparent 62%)}
.grid-lines{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(236,238,230,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,230,.028) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(70rem 42rem at 50% 0%,#000 30%,transparent 78%);mask-image:radial-gradient(70rem 42rem at 50% 0%,#000 30%,transparent 78%)}
nav.top{height:66px;display:flex;align-items:center;border-bottom:1px solid var(--border)}
nav.top .wrap{display:flex;align-items:center;gap:14px;width:100%}
.logo{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px}
.mark{width:29px;height:29px;display:grid;place-items:center;flex:none;filter:drop-shadow(0 0 10px rgba(210,238,28,.38))}.mark svg{width:100%;height:100%}
.pagechip{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:6px;padding:3px 9px;background:var(--acc-soft)}
.nav-links{margin-left:auto;display:flex;gap:4px}
.nav-links a{color:var(--t2);font-size:14px;padding:8px 13px;border-radius:9px}
.nav-links a:hover{color:var(--t1);background:rgba(236,238,230,.05)}
main{padding:56px 0 80px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.head h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.live{display:inline-flex;align-items:center;gap:7px;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--green)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sub{color:var(--t3);font-size:14px;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.stat{border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--panel);transition:.25s}
.stat:hover{border-color:color-mix(in srgb,var(--acc) 30%,transparent);transform:translateY(-2px)}
.stat .n{font-size:34px;font-weight:800;letter-spacing:-1.2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:12.5px;color:var(--t3);margin-top:4px}
.stat .d{font-size:11.5px;color:var(--t2);margin-top:8px}
h2{font-family:'Geist Mono',monospace;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:2.2px;color:var(--acc);margin:38px 0 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--border)}
.tablecard{border:1px solid var(--border);border-radius:16px;background:var(--panel);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
th{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);font-weight:600;background:rgba(236,238,230,.025)}
td{color:var(--t2)}
td.mono{font-family:'Geist Mono',monospace;font-size:12px;color:var(--t1)}
.rel{color:var(--green)}
.bar{height:6px;border-radius:99px;background:rgba(236,238,230,.08);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
footer{border-top:1px solid var(--border);padding:26px 0;font-size:13px;color:var(--t3)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid,.grid.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="grid-lines"></div>

<nav class="top">
  <div class="wrap">
    <a class="logo" href="/"><span class="mark"><svg class="vmark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="vg" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#d2ee1c"/><stop offset="1" stop-color="#a4c200"/></linearGradient></defs><path d="M16 2.4l11.2 3.7v8.1c0 7.6-5.5 12.8-11.2 15C10.3 27 4.8 21.8 4.8 14.2V6.1z" fill="url(#vg)"/><path d="M10.6 16.4l3.9 3.9L21.7 12" stroke="#11140a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Vouch</a>
    <span class="pagechip">Metrics</span>
    <div class="nav-links"><a href="/services">Services</a><a href="/verify">Verify</a><a href="/docs">Docs</a></div>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="head"><h1>Network metrics</h1><span class="live"><i></i>LIVE</span></div>
    <div class="sub">Straight from the protocol — <a href="/v1/providers" style="color:var(--acc)">/v1/providers</a>, <a href="/v1/insurance" style="color:var(--acc)">/v1/insurance</a>, <a href="/v1/offers" style="color:var(--acc)">/v1/offers</a>. Refreshes every few seconds.</div>

    <div class="grid" id="top"></div>
    <div class="grid two" id="pool"></div>

    <h2>Providers</h2>
    <div class="tablecard">
      <table>
        <thead><tr><th>Provider</th><th>Protocol</th><th>Track</th><th>Reliability</th><th>Settled</th><th>Slashed</th><th>Stake</th></tr></thead>
        <tbody id="provs"><tr><td colspan="7" style="padding:24px;text-align:center;color:var(--t3)">loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<footer><div class="wrap">© 2026 Vouch — the outcome layer for AI agents</div></footer>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = (n) => '$' + (Math.round(n*1e6)/1e6);

async function load(){
  try{
    const [caps, offers, provs, ins] = await Promise.all([
      fetch('/v1/capabilities').then(r=>r.json()),
      fetch('/v1/offers').then(r=>r.json()),
      fetch('/v1/providers').then(r=>r.json()),
      fetch('/v1/insurance').then(r=>r.json()),
    ]);
    const P = provs.providers ?? [];
    const stake = P.reduce((s,p)=>s+p.stake,0);
    const settled = P.reduce((s,p)=>s+p.settled,0);
    const slashed = P.reduce((s,p)=>s+p.slashed,0);
    const rel = settled+slashed>0 ? settled/(settled+slashed) : null;

    document.getElementById('top').innerHTML = [
      [caps.capabilities.length, 'capabilities', 'all backed by slashable stake'],
      [P.length, 'staked providers', 'competing on every task'],
      ['$'+Math.round(stake).toLocaleString(), 'slashable capital', 'bonded across the network'],
      [rel===null?'—':Math.round(rel*100)+'%', 'verified-settlement rate', settled+slashed>0?(settled+' settled · '+slashed+' slashed'):'awaiting first tasks'],
    ].map(([n,l,d])=>'<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div><div class="d">'+d+'</div></div>').join('');

    document.getElementById('pool').innerHTML = [
      [money(ins.pool_balance), 'outcome-insurance pool', 'compensates agents on failed tasks'],
      [money(ins.total_funded), 'total slashed into the pool', ins.claims_paid+' claim'+(ins.claims_paid===1?'':'s')+' paid'],
    ].map(([n,l,d])=>'<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div><div class="d">'+d+'</div></div>').join('');

    document.getElementById('provs').innerHTML = P.length ? P.map(p=>{
      const r = p.reliability===null? null : Math.round(p.reliability*100);
      return '<tr><td class="mono">'+esc(p.id)+'</td><td class="mono">'+esc(p.protocol)+'</td><td class="mono">'+p.track+
        '</td><td>'+(r===null?'<span style="color:var(--t3)">new</span>':'<div style="display:flex;align-items:center;gap:8px"><div class="bar"><i style="width:'+r+'%"></i></div><span class="rel mono">'+r+'%</span></div>')+
        '</td><td class="mono">'+p.settled+'</td><td class="mono">'+p.slashed+'</td><td class="mono">'+money(p.stake)+'</td></tr>';
    }).join('') : '<tr><td colspan="7" style="padding:24px;text-align:center;color:var(--t3)">no providers</td></tr>';
  }catch(e){ /* keep last render */ }
}
load(); setInterval(load, 4000);
</script>
</body>
</html>
