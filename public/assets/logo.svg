<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Vouch mark: a near-black rounded tile, a violet check, and the small violet square at the tip of the long stroke. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a21"/>
      <stop offset="1" stop-color="#0f0e13"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a40ea"/>
      <stop offset="1" stop-color="#4a30d2"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="12" fill="url(#tile)"/>
  <path d="M6.5 40H29L40.6 61L70.3 15.7H91.3L38.5 97Z" fill="url(#check)"/>
  <rect x="81" y="8" width="10.3" height="7.7" fill="#5a40ea"/>
